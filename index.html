<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuda Dashboard Links</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="hero-top">
          <img
            class="brand-logo"
            src="https://kuda.co.za/wp-content/uploads/2021/02/Kuda-logo-01.png"
            alt="Kuda"
          />
          <h1>DASHBOARDS</h1>
        </div>
        <p>Quick links to your key sites and tools.</p>
      </header>

      <section class="link-grid" aria-label="Site links">
        <a
          class="link-card card-preview-link"
          href="https://portal.kuda.co.za"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Drakenstein Dashboard preview"
        >
          <img
            class="card-preview"
            src="img/Drakenstein_Dashboard_preview.png"
            alt="Drakenstein Dashboard preview"
          />
          <span class="card-meta">
            <span class="card-name">Drakenstein Dashboard</span>
            <span class="card-subtitle">portal.kuda.co.za</span>
          </span>
        </a>

        <a class="link-card" href="https://www.google.com" target="_blank" rel="noopener noreferrer">
          <span class="card-title">Coming Soon!</span>
          <span class="card-subtitle">dashboard.kuda.co.za</span>
        </a>

        <a class="link-card" href="https://www.github.com" target="_blank" rel="noopener noreferrer">
          <span class="card-title">Coming Soon!</span>
          <span class="card-subtitle">dashboard.kuda.co.za</span>
        </a>
      </section>

      <footer class="page-footer">
        <p>For internal use only.</p>
      </footer>
    </main>
  </body>
</html>
