<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuda Dashboard Links</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="hero-top">
          <img
            class="brand-logo"
            src="https://kuda.co.za/wp-content/uploads/2021/02/Kuda-logo-01.png"
            alt="Kuda"
          />
          <h1>WORKSPACE</h1>
        </div>
        <p>Quick links to your key sites and tools.</p>
      </header>

      <section class="dashboard-group" aria-label="Kuda Internal Dashboards">
        <h2 class="dashboard-section-title">Kuda Internal Dashboards</h2>
        <div class="link-grid">
          <a class="link-card card-preview-link" href="https://dashboard.kuda.co.za/login.html" target="_blank" rel="noopener noreferrer" aria-label="Kuda Management Dashboard preview">
            <img
            class="card-preview"
            src="img/Kuda_Management_Dashboard_preview.png"
            alt="Kuda Management Dashboard preview"
            />
            <span class="card-meta">
              <span class="card-name">Kuda Management Dashboard</span>
              <span class="card-subtitle">dashboard.kuda.co.za</span>
            </span>
          </a>

          <a class="link-card card-preview-link" href="https://niche-risk-report.kuda.co.za/" target="_blank" rel="noopener noreferrer" aria-label="Guardrisk Triangulation Dashboard preview">
            <img
              class="card-preview"
              src="img/Guardrisk_Triangulation_Dashboard_preview.png"
              alt="Guardrisk Triangulation Dashboard preview"
            />
            <span class="card-meta">
              <span class="card-name">Guardrisk Triangulation Dashboard</span>
              <span class="card-subtitle">niche-risk-report.kuda.co.za</span>
            </span>
          </a>
        </div>
      </section>

      <section class="dashboard-group" aria-label="Kuda Client Dashboards">
        <h2 class="dashboard-section-title">Kuda Client Dashboards</h2>
        <div class="link-grid">
          <a
            class="link-card card-preview-link"
            href="https://portal.kuda.co.za"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Drakenstein Dashboard preview"
          >
            <img
              class="card-preview"
              src="img/Drakenstein_Dashboard_preview.png"
              alt="Drakenstein Dashboard preview"
            />
            <span class="card-meta">
              <span class="card-name">Drakenstein Dashboard</span>
              <span class="card-subtitle">portal.kuda.co.za</span>
            </span>
          </a>
        </div>
      </section>

      <footer class="page-footer">
        <p>For internal use only.</p>
      </footer>
    </main>
  </body>
</html>
